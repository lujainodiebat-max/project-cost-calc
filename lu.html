<!DOCTYPE html>
<html lang="en";
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Cost Calculator</title>
    
    <style>
        /* CSS Section: للتنسيق الجمالي */
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calc-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            border-top: 6px solid #28a745;
        }

        h3 { color: #2c3e50; text-align: center; margin-bottom: 20px; }

        label { display: block; margin-top: 15px; font-weight: 600; color: #555; }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover { background-color: #218838; }

        #result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e9f7ef;
            border-radius: 8px;
            text-align: center;
        }

        #total-text {
            font-size: 20px;
            font-weight: bold;
            color: #155724;
        }
    </style>
</head>
<body>

    <div class="calc-card">
        <h3>Project Estimator 📊</h3>
        
        <label>Fixed Costs (Tools/Licensing):</label>
        <input type="number" id="fixedCosts" placeholder="0.00">

        <label>Hourly Rate ($):</label>
        <input type="number" id="hourlyRate" placeholder="0.00">

        <label>Work Hours:</label>
        <input type="number" id="workHours" placeholder="0">

        <button onclick="calculateBudget()">Calculate Total Budget</button>

        <div id="result-box">
            <span id="total-text">Total: $0.00</span>
        </div>
    </div>

    <script>
        /* JavaScript Section: للعمليات الحسابية */
        function calculateBudget() {
            // جلب القيم من الخانات وتحويلها لأرقام
            const fixed = parseFloat(document.getElementById('fixedCosts').value) || 0;
            const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
            const hours = parseFloat(document.getElementById('workHours').value) || 0;

            // المعادلة الحسابية
            const total = fixed + (rate * hours);

            // عرض النتيجة في الصفحة وتنسيقها لتظهر برقمين بعد الفاصلة
            document.getElementById('total-text').innerText = "Total: $" + total.toFixed(2);
        }
    </script>

</body>
</html>
